[flake8]
# Kept compatible with black: black owns line length (88-col target), so the
# only over-length survivors are unsplittable long strings (e.g. the French
# seed text). We therefore defer E501 to black and ignore the two checks black
# intentionally violates (E203, W503).
max-line-length = 100
extend-ignore = E203, W503, E501
exclude = .git,__pycache__,build,dist
per-file-ignores =
    # Module-level imports intentionally sit after DATABASE_URL is set so the
    # app binds to the test database before `server` is imported.
    test_api.py: E402

[isort]
profile = black

[mypy]
# Third-party libs here (sqlalchemy async, jwt, bcrypt, httpx, anthropic) ship
# partial or no stubs; ignoring missing imports keeps the signal on our own code.
ignore_missing_imports = True
